<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BeatVote</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #12111a; color: #f1f0f7; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <p id="msg">Starting BeatVote …</p>
    <script>
      // The BeatVote server runs inside the app (Node.js engine) and serves the real UI on port 4173,
      // the same origin as on the desktop, so the Spotify redirect URI http://127.0.0.1:4173/callback works for both.
      const url = 'http://127.0.0.1:4173';
      const started = Date.now();
      (async function poll() {
        try {
          await fetch(url + '/api/info', { mode: 'no-cors', cache: 'no-store' });
          location.replace(url + '/');
        } catch {
          if (Date.now() - started > 30000) {
            document.getElementById('msg').textContent = 'The BeatVote server did not start. Close the app completely and open it again.';
          }
          setTimeout(poll, 300);
        }
      })();
    </script>
  </body>
</html>
